version: '3.8'

services:
  ssas-mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ssas-mcp-server
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - SsasConnection__Server=${SSAS_SERVER}
      - SsasConnection__Database=${SSAS_DATABASE}
      - SsasConnection__Username=${SSAS_USERNAME}
      - SsasConnection__Password=${SSAS_PASSWORD}
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    stdin_open: true
    tty: true